<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>login dan signup</title>
    <link rel="stylesheet" href="./style.css">
  </head>
    
  <body>
  <div class="form-structor">
    
    <div class="login">
        <div class="center">
            <h2 class="form-title" id="login">Log in</h2>
            <div class="form-holder">
                <input type="text" class="input-nama" placeholder="Name" />
                <input type="password" placeholder="Password" />
            </div>
            <button class="submit-btn">Log in</button>
        </div>
    </div>

    <div class="signup slide-up">
        <h2 class="form-title" id="signup"><span>or</span>Sign up</h2>
        <div class="form-holder">
            <input type="text" class="input-nama" placeholder="Name" />
            <input type="password" placeholder="Password" />
        </div>
        <button class="submit-btn">Sign up</button>
    </div>

</div>

    <script src="./script.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const tombolSubmit = document.querySelectorAll('.submit-btn');
            
            tombolSubmit.forEach((tombol) => {
                tombol.onclick = function(event) {
                    event.preventDefault(); 
                    event.stopPropagation(); 
                    
                    // Cari form induk tempat tombol berada
                    const formInduk = tombol.parentElement;
                    
                    // Ambil input nama dan password di dalam form tersebut
                    const inputNama = formInduk.querySelector('.input-nama');
                    const inputPassword = formInduk.querySelector('input[type="password"]');
                    
                    const namaUser = inputNama ? inputNama.value.trim() : "";
                    const passwordUser = inputPassword ? inputPassword.value : "";

                    // Cek apakah ini tombol Log in atau Sign up berdasarkan teks tombol
                    const isLoginBtn = tombol.textContent.toLowerCase().includes('log in');

                    // --- JALUR LOGIN ADMIN ---
                    if (isLoginBtn) {
                        if (namaUser === 'admin' && passwordUser === '123') {
                            localStorage.setItem('username', 'Admin');
                            localStorage.setItem('isLoggedIn', 'true');
                            localStorage.setItem('role', 'admin'); 
                            
                            // Masuk ke halaman admin
                            window.location.href = 'admin/admin.html';
                            return; 
                        }
                    }

                    // --- JALUR USER BIASA (Log in biasa / Sign up) ---
                    if (namaUser !== "") {
                        localStorage.setItem('username', namaUser);
                    } else {
                        localStorage.setItem('username', 'Petualang');
                    }
                    
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('role', 'user');
                    
                    // Masuk ke halaman utama website
                    window.location.href = '../../index.html';
                };
            });
        });
    </script>

  </body>
  
</html>
