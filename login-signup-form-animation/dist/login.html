<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>login/signup form animation</title>
    <link rel="stylesheet" href="./style.css">
  </head>
    
  <body>
  <div class="form-structor">
	<div class="signup">
		<h2 class="form-title" id="signup"><span>or</span>Sign up</h2>
		<div class="form-holder">
			<input type="text" id="username" placeholder="Name" />
			<input type="password" id="password" placeholder="Password" />
		</div>
		<button class="submit-btn">Sign up</button>
	</div>
	<div class="login slide-up">
		<div class="center">
			<h2 class="form-title" id="login"><span>or</span>Log in</h2>
			<div class="form-holder">
				<input type="text" id="username" placeholder="Name" />
				<input type="password" id="password" placeholder="Password" />
			</div>
			<button class="submit-btn">Log in</button>
		</div>
	</div>
</div>

    <script src="./script.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const tombolSubmit = document.querySelectorAll('.submit-btn');
            
            tombolSubmit.forEach((tombol) => {
                tombol.onclick = function(event) {
                    event.preventDefault(); 
                    event.stopPropagation(); 
                    
                    // Mundur 2 kali untuk keluar dari folder 'dist' dan 'login-signup-...'
                    // menuju index.html utama milik template Adventure kamu.
                    window.location.href = '../../index.html';
                };
            });
        });
    </script>

  </body>
  
</html>
